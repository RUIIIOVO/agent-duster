# =============================================================================
# CC Switch 适配器清单。字段词汇表见 adapters/claude-code.toml 文件头注释。
# 桌面切换器应用,无 CLI 二进制,probe 只看目录。
# =============================================================================

[agent]
id = "cc-switch"
display_name = "CC Switch"

[probe]
# ~/.cc-switch 数据目录存在即视为已安装。
any_of = ["~/.cc-switch"]

# ── Skill:托管技能库,每技能一个子目录,SKILL.md 承载元数据 ──────────────
[[resource]]
kind = "skill"
scope = "global"
path = "~/.cc-switch/skills"
glob = "*/SKILL.md"
mapper = "skill/frontmatter-md"

# ── Memory:主数据库(供应商配置等)。**不是 artifact**——它是应用配置本身,
#           删了丢配置且无处再生。只统计,不参与清理。────────────────────
[[resource]]
kind = "memory"
scope = "global"
path = "~/.cc-switch/cc-switch.db"
mapper = "stats-only"

# ── Artifact:数据库滚动备份 ─────────────────────────────────────────────
# 本机实测 10 份日备份 × 约 7.6 MB,而主库本身才 7.3 MB。旧备份过期即无用,
# 但「留几天」是用户决定 ⇒ l2,按 --older-than 天数清并二次确认。
[[resource]]
kind = "artifact"
scope = "global"
path = "~/.cc-switch/backups"
mapper = "stats-only"
clean_level = "l2"

[[resource]]
kind = "artifact"
scope = "global"
path = "~/.cc-switch/logs"
mapper = "stats-only"
clean_level = "l1"   # 日志,自动重建
