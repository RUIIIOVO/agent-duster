# =============================================================================
# Cursor 适配器清单。字段词汇表见 adapters/claude-code.toml 文件头注释。
# 无 mcp 节:本机未见 ~/.cursor/mcp.json,MCP 配置形态未证实,宁缺毋滥。
# 无 skill/memory 节:Cursor 的规则/记忆模型与本清单词汇表不对应。
# 刻意不声明 ~/.cursor/ai-tracking:AI 代码采纳追踪数据,既非产物也非本体,
#           内部格式未证实,按「不理解的东西不动」放弃认领。
#           注意:probe 已认领 ~/.cursor,所以未声明的子目录既不入索引、
#           也不会出现在 unclassified 表里——它现在谁都不统计。这个洞是
#           collect_unclassified 只看顶层候选目录导致的,修在扫描器里。
# =============================================================================

[agent]
id = "cursor"
display_name = "Cursor"

[probe]
# ~/.cursor 数据目录存在即视为已安装。
any_of = ["~/.cursor"]
binary = "cursor"
# M0 只存不执行。
version_cmd = ["cursor", "--version"]

# ── Session:按项目分目录的 agent 会话/上下文,格式未证实,只统计 ─────────
[[resource]]
kind = "session"
scope = "global"
path = "~/.cursor/projects"
mapper = "stats-only"

# ── Install:已安装扩展本体 ──────────────────────────────────────────────
[[resource]]
kind = "install"
scope = "global"
path = "~/.cursor/extensions"
mapper = "stats-only"
