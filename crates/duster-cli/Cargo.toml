[package]
name = "duster-cli"
description = "duster command-line shell (clap)."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "duster"
path = "src/main.rs"

[dependencies]
duster-core = { workspace = true }
# 只为共享的封闭词汇表（CleanLevel 的档位与展示标签）。
# model 是最底层、零 I/O，CLI 直依赖它不构成越层。
duster-model = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dialoguer = { workspace = true }
console = { workspace = true }
