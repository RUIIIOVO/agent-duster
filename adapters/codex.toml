# =============================================================================
# Codex 适配器清单。字段词汇表见 adapters/claude-code.toml 文件头注释。
# =============================================================================

[agent]
id = "codex"
display_name = "Codex"

[probe]
# ~/.codex 数据目录存在即视为已安装。
any_of = ["~/.codex"]
binary = "codex"
# M0 只存不执行。
version_cmd = ["codex", "--version"]

# ── MCP:config.toml 的 mcp_servers 表(TOML 点路径定位)──────────────────
[[resource]]
kind = "mcp"
scope = "global"
path = "~/.codex/config.toml"
toml_key = "mcp_servers"
mapper = "mcp/codex-toml"

# ── Skill:每个技能一个目录,SKILL.md 承载元数据 ─────────────────────────
[[resource]]
kind = "skill"
scope = "global"
path = "~/.codex/skills"
glob = "*/SKILL.md"
mapper = "skill/frontmatter-md"
install_paths = ["node_modules", "dist", "bin", ".git"]

# ── Memory:全局记忆 ~/.codex/AGENTS.md ──────────────────────────────────
[[resource]]
kind = "memory"
scope = "global"
path = "~/.codex/AGENTS.md"
mapper = "memory/markdown"

# ── Session:JSONL 会话库 ────────────────────────────────────────────────
[[resource]]
kind = "session"
scope = "global"
path = "~/.codex/sessions"
mapper = "native/codex-session"

# ── Session:归档会话。**不是 artifact**。──────────────────────────────
# 本机实测(2026-08-10):153 个 rollout jsonl,与 sessions/ 零重名——
# 归档是「从 sessions 移走」而非「从 sessions 复制」,这里是唯一副本。
# 曾被误标 artifact/l1「可从 sessions 再归档」,那会把用户唯一的历史
# 当缓存删掉。要瘦身走 session prune(按天数压缩/导出),不走 clean。
# 格式与 sessions/ 相同,但目录不按 YYYY/MM/DD 分层,M0 先只统计。
[[resource]]
kind = "session"
scope = "global"
path = "~/.codex/archived_sessions"
mapper = "stats-only"

# ── Artifact:可清理产物 ─────────────────────────────────────────────────
# 日志库。本机实测 200783 页里 198286 页是空闲页(98.8%),实际只有
# 11353 行日志——VACUUM 一把回收约 775 MB 且一条日志都不丢,
# 所以是 l0(无损)而不是 l1(删除重建)。
[[resource]]
kind = "artifact"
scope = "global"
path = "~/.codex/logs_2.sqlite"
mapper = "stats-only"
clean_level = "l0"

[[resource]]
kind = "artifact"
scope = "global"
path = "~/.codex/cache"
mapper = "stats-only"
clean_level = "l1"   # 纯缓存,自动重建

# ── Install:插件本体(内含 cache/,不拆,见头注释「重叠路径」)───────────
[[resource]]
kind = "install"
scope = "global"
path = "~/.codex/plugins"
mapper = "stats-only"

# ── Uninstall ───────────────────────────────────────────────────────────
# 一棵独占树。owns 与 M1 `uninstall --data-only` 取的根一致(probe.any_of 里
# 实际存在的那条),显式写出来把删除范围钉住。
# 注意 ~/.codex 里有清单没声明的子目录(computer-use/、ambient-suggestions/、
# .tmp/ 等),卸载要整棵删——uninstall 的所有权模型与 clean/prune 相反。
#
# 无 shared 节:本机 2026-08-11 逐个文件确认,没有别的 agent 的文件里存着
# Codex 的配置键。~/.claude.json 的 /mcpServers 与 ~/.gemini/settings.json 的
# mcpServers 里只有一个 stitch(Google Stitch,不是本清单里的 agent),
# ~/.config/opencode/opencode.jsonc 只有 $schema。
# 一个 schema 表达不了的残留:~/.cc-switch/cc-switch.db 的 providers 表
# (app_type = 'codex')存着 Codex 的供应商档案与密钥,SQLite 行级手术不在
# 本 schema 能力内。反方向(cc-switch 写进 ~/.codex/config.toml 的
# model_catalog_json)记在 adapters/cc-switch.toml 里,那是**它的**键。
[uninstall]
owns = ["~/.codex"]

# 本机 2026-08-11 实测:`mise which codex` →
#   ~/.local/share/mise/installs/npm-openai-codex/latest/node_modules/.bin/codex
# 即 mise 的 npm 后端装的 npm:@openai/codex(0.147.0),声明在
# ~/.config/mise/config.toml。manager 写 npm 是因为包来自 npm 注册表,
# 但**卸载命令必须走 mise**:本机 `npm ls -g --depth 0` 里没有这个包,
# `npm uninstall -g @openai/codex` 会直接失败。
[[uninstall.package]]
manager = "npm"
detect = ["mise", "which", "codex"]
command = ["mise", "unuse", "--global", "npm:@openai/codex"]
