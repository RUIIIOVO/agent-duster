# =============================================================================
# Codex 适配器清单。字段词汇表见 adapters/claude-code.toml 文件头注释。
# =============================================================================

[agent]
id = "codex"
display_name = "Codex"

[probe]
# ~/.codex 数据目录存在即视为已安装。
any_of = ["~/.codex"]
binary = "codex"
# M0 只存不执行。
version_cmd = ["codex", "--version"]

# ── MCP:config.toml 的 mcp_servers 表(TOML 点路径定位)──────────────────
[[resource]]
kind = "mcp"
scope = "global"
path = "~/.codex/config.toml"
toml_key = "mcp_servers"
mapper = "mcp/codex-toml"

# ── Skill:每个技能一个目录,SKILL.md 承载元数据 ─────────────────────────
[[resource]]
kind = "skill"
scope = "global"
path = "~/.codex/skills"
glob = "*/SKILL.md"
mapper = "skill/frontmatter-md"

# ── Memory:全局记忆 ~/.codex/AGENTS.md ──────────────────────────────────
[[resource]]
kind = "memory"
scope = "global"
path = "~/.codex/AGENTS.md"
mapper = "memory/markdown"

# ── Session:JSONL 会话库 ────────────────────────────────────────────────
[[resource]]
kind = "session"
scope = "global"
path = "~/.codex/sessions"
mapper = "native/codex-session"

# ── Session:归档会话。**不是 artifact**。──────────────────────────────
# 本机实测(2026-08-10):153 个 rollout jsonl,与 sessions/ 零重名——
# 归档是「从 sessions 移走」而非「从 sessions 复制」,这里是唯一副本。
# 曾被误标 artifact/l1「可从 sessions 再归档」,那会把用户唯一的历史
# 当缓存删掉。要瘦身走 session prune(按天数压缩/导出),不走 clean。
# 格式与 sessions/ 相同,但目录不按 YYYY/MM/DD 分层,M0 先只统计。
[[resource]]
kind = "session"
scope = "global"
path = "~/.codex/archived_sessions"
mapper = "stats-only"

# ── Artifact:可清理产物 ─────────────────────────────────────────────────
# 日志库。本机实测 200783 页里 198286 页是空闲页(98.8%),实际只有
# 11353 行日志——VACUUM 一把回收约 775 MB 且一条日志都不丢,
# 所以是 l0(无损)而不是 l1(删除重建)。
[[resource]]
kind = "artifact"
scope = "global"
path = "~/.codex/logs_2.sqlite"
mapper = "stats-only"
clean_level = "l0"

[[resource]]
kind = "artifact"
scope = "global"
path = "~/.codex/cache"
mapper = "stats-only"
clean_level = "l1"   # 纯缓存,自动重建

# ── Install:插件本体(内含 cache/,不拆,见头注释「重叠路径」)───────────
[[resource]]
kind = "install"
scope = "global"
path = "~/.codex/plugins"
mapper = "stats-only"
