# =============================================================================
# OpenCode 适配器清单。字段词汇表见 adapters/claude-code.toml 文件头注释。
# ~/.opencode 只是 npm 安装壳(bin/ + node_modules/),配置与数据在别处
# (XDG 目录),M0 只认领安装产物。package.json/package-lock.json 不是资源。
#
# 全目录都是 install:这个 agent 在 home 下**没有任何可清理产物**。
# node_modules 曾被标 artifact/l1「npm install 即可重建」——重建要联网、
# 要装对版本,失败就等于 OpenCode 没了,这是卸载不是清理。
# =============================================================================

[agent]
id = "opencode"
display_name = "OpenCode"

[probe]
# ~/.opencode 安装目录存在即视为已安装。
any_of = ["~/.opencode"]
binary = "opencode"
# M0 只存不执行。
version_cmd = ["opencode", "--version"]

# ── Install:npm 依赖树 ──────────────────────────────────────────────────
[[resource]]
kind = "install"
scope = "global"
path = "~/.opencode/node_modules"
mapper = "stats-only"

# ── Install:入口二进制 ──────────────────────────────────────────────────
[[resource]]
kind = "install"
scope = "global"
path = "~/.opencode/bin"
mapper = "stats-only"
