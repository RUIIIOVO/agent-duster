# =============================================================================
# Pi 适配器清单。字段词汇表见 adapters/claude-code.toml 文件头注释。
# ~/.pi 下只有 agent/ 子目录。会话格式未证实,一律只统计。
# 刻意不声明 ~/.pi/agent/auth.json:凭据文件,连统计都不碰。
# =============================================================================

[agent]
id = "pi"
display_name = "Pi"

[probe]
# ~/.pi 数据目录存在即视为已安装。
any_of = ["~/.pi"]
binary = "pi"
# M0 只存不执行。
version_cmd = ["pi", "--version"]

# ── Session:按项目路径分目录,内部格式未证实,只统计 ─────────────────────
[[resource]]
kind = "session"
scope = "global"
path = "~/.pi/agent/sessions"
mapper = "stats-only"

# ── Memory:全局设置(只统计不解析)──────────────────────────────────────
[[resource]]
kind = "memory"
scope = "global"
path = "~/.pi/agent/settings.json"
mapper = "stats-only"

# ── Install:随附工具二进制(fd/rg 等)───────────────────────────────────
# 曾被标 artifact/l1「自动重新下载」——重新下载要联网,失败则 Pi 的搜索
# 能力直接缺失。属安装产物,不参与清理。
[[resource]]
kind = "install"
scope = "global"
path = "~/.pi/agent/bin"
mapper = "stats-only"

# ── Uninstall ───────────────────────────────────────────────────────────
# 一棵独占树,与 M1 `uninstall --data-only` 取的根一致。刻意不把
# ~/.pi/agent/auth.json 排除在外:卸载就是要把凭据一起带走(归档由
# --export 负责,不由 owns 负责)。
# 无 shared 节:本机 2026-08-11 确认没有别的 agent 的文件里存着 Pi 的配置键。
[uninstall]
owns = ["~/.pi"]

# 本机 2026-08-11 实测:`mise which pi` →
#   ~/.local/share/mise/installs/npm-earendil-works-pi-coding-agent/latest/node_modules/.bin/pi
# 即 mise 的 npm 后端装的 npm:@earendil-works/pi-coding-agent(0.84.1)。
# scope 不能错:@oh-my-pi/pi-coding-agent 是 omp,不是 pi。
[[uninstall.package]]
manager = "npm"
detect = ["mise", "which", "pi"]
command = ["mise", "unuse", "--global", "npm:@earendil-works/pi-coding-agent"]
